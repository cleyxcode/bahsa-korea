  h=`<p class="note">Tap sel untuk mendengar bunyinya. Baris = konsonan, kolom = vokal. Cukup hafal 14 konsonan + 10 vokal, lalu gabungkan!</p><div class="tw"><table><tr><th></th>${V.map(v=>`<th>${v[0]}<br>${v[2]}</th>`).join("")}</tr>${C.map((c,i)=>`<tr><th>${c[0]}<br>${c[2]||"–"}</th>${V.map((v,j)=>{const s=S[i*10+j];return `<td data-s="${s[0]}"><b>${s[0]}</b>${s[1]}</td>`}).join("")}</tr>`).join("")}</table></div>`;
 }else{
  h=`<p class="note">Tap kartu untuk mendengar bunyinya ([[sound]]). Jika tidak ada suara, aktifkan suara Korea di pengaturan teks-ke-suara perangkatmu.</p><p><button class="on" id="all">[[sound]] Putar semua berurutan</button></p><div class="grid">${items().map(x=>`<div class="c" data-s="${x[0]}">${IMG[x[0]]?`<img src="${IMG[x[0]]}" alt="${x[1]}">`:""}<b style="${(mode=="w"||mode=="p")?"font-size:1.4rem;word-break:keep-all":""}">${x[0]}</b><span>${x[1]} [[sound]]</span><small>${x[2]}</small><div class="mt"><i style="width:${mb(x)}%"></i></div></div>`).join("")}</div>`;

}
function start(w){let it=items();if(w){let m={};try{m=JSON.parse(localStorage.getItem("wk")||"{}")}catch(e){}const x=it.filter(i=>m[i[0]]>0);if(x.length)it=x}if(dir==2){it=it.filter(x=>IMG[x[0]]);if(it.length<4)dir=0}Q=sh(it).slice(0,10);qi=0;score=0;done=false;test()}
function test(){
 const a=$("app");
 if(!Q.length&&!done){
  a.innerHTML=`<div class="lbl">Arah soal</div><div class="seg"><button class="${!dir?"on":""}" data-d="0">Huruf → Bacaan</button><button class="${dir==1?"on":""}" data-d="1">Bacaan → Huruf</button><button class="${dir==2?"on":""}" data-d="2">[[image]] Gambar → Kata</button></div><p><button class="on" id="go">Mulai tes (10 soal acak)</button> <button id="weak">[[target]] Latih yang sering salah</button></p><p class="note">Tips: tekan [[bulb]] Petunjuk jika lupa. Soal yang salah akan diulang di akhir, dan huruf yang sering salah dicatat otomatis.</p>`;return;
 }
 if(done){
  const e=score>=9?"[[trophy]]":score>=6?"[[star]]":"[[target]]";
  a.innerHTML=`<div class="q"><div class="res">${e}</div><h2>Skor: ${score} / ${Q.length}</h2><p class="note">${score>=9?"Luar biasa!":score>=6?"Bagus, ulangi untuk lebih hafal.":"Tidak apa-apa, buka tab Belajar lalu coba lagi."}</p><button class="on" id="again">Tes lagi (soal baru)</button></div>`;return;
 }
 const q=Q[qi],all=items();
 const pool=sh(all.filter(x=>x[1]!=q[1]&&x[0]!=q[0]));
 const wrong=[],seen=new Set();
 for(const x of pool){const key=dir?x[0]:x[1];if(!seen.has(key)){seen.add(key);wrong.push(x);}if(wrong.length==3)break}
 const opts=sh([q,...wrong]);if(!dir)setTimeout(()=>say(q[0]),200);
 a.innerHTML=`<div class="bar"><i style="width:${qi/Q.length*100}%"></i></div><div class="q"><div class="note">Soal ${qi+1} dari ${Q.length} · Skor ${score}</div>${dir==2?`<img class="qi" src="${IMG[q[0]]}" alt=""><div class="note">Pilih kata Korea yang cocok dengan gambar</div>`:dir?`<div class="big" style="font-size:3rem">${q[1]}</div><div class="note">Pilih huruf yang benar</div>`:`<div class="big" style="${(mode=="w"||mode=="p")?"font-size:2.6rem":""}">${q[0]}</div><div class="note">Bagaimana cara membacanya?</div><button class="hint" data-s="${q[0]}">[[sound]] Dengar lagi</button>`}<div class="opts">${opts.map(o=>`<button data-a="${o[0]}">${dir?o[0]:o[1]}</button>`).join("")}</div><div class="tip" id="tip"><button class="hint" id="hint">[[bulb]] Petunjuk</button></div></div>`;
}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-m],[data-t],[data-s],[data-d],[data-a],[data-f],#go,#again,#next,#hint,#weak,#all,#tv,[data-sa],#sgo,#sn,#si,#sc,#smh,#shint");if(!t)return;
 if(t.dataset.m){mode=t.dataset.m;route();return}
 if(t.dataset.t){tab=t.dataset.t;route();return}
 if(t.dataset.s){say(t.dataset.s);return}
 if(t.dataset.d){dir=+t.dataset.d;test();return}
 if(t.id=="go"||t.id=="again"){start();return}if(t.id=="weak"){start(1);return}if(t.id=="tv"){say("ㅏ");return}if(t.dataset.sa!==undefined){sAns(t.dataset.sa);return}if(t.id=="sgo"){sStart();return}if(t.id=="sn"){SM.i++;sShow();return}if(t.id=="si"){SM.q[SM.i].sh=1;sQ();return}if(t.id=="sc"){const i=$("ti");if(i&&!i.disabled)sAns(i.value);return}if(t.id=="smh"){smartHome();return}if(t.id=="shint"){$("stip").innerHTML="[[bulb]] "+SM.q[SM.i].x[2];return}if(t.id=="all"){items().forEach((x,i)=>setTimeout(()=>say(x[0]),i*1300));return}if(t.id=="hint"){$("tip").innerHTML="[[bulb]] "+Q[qi][2];return}if(t.dataset.f){const f=t.dataset.f;if(f=="flip"){fl=true;say(F[0][0])}else if(f=="yes"){F.shift();fl=false}else if(f=="no"){F.push(F.shift());fl=false}else{F=null;fl=false}card();return}
 if(t.id=="next"){qi++;if(qi>=Q.length)done=true;test();return}
 if(t.dataset.a){
  const q=Q[qi],bs=document.querySelectorAll(".opts button");if(bs[0].disabled)return;
  const ok=t.dataset.a==q[0];if(ok)score++;else if(!q.rq){Q.push(Object.assign([...q],{rq:1}))}wk(q[0],ok);
  bs.forEach(b=>{b.disabled=true;if(b.dataset.a==q[0])b.classList.add("ok");else if(b==t)b.classList.add("no")});
  say(q[0]);
  $("tip").innerHTML=`${ok?"[[ok]] Benar!":"[[no]] Kurang tepat."} <b>${q[0]}</b> = ${q[1]}<br>[[bulb]] ${q[2]}<br><button class="on" id="next" style="margin-top:10px">${qi==Q.length-1?"Lihat skor":"Soal berikutnya →"}</button>`;
 }
});

const EX={w:W,p:W.slice(0,20),g:[["ㅐ","ae","ㅏ + ㅣ → 애"],["ㅔ","e","ㅓ + ㅣ → 에"],["ㅒ","yae","ㅑ + ㅣ → 얘"],["ㅖ","ye","ㅕ + ㅣ → 예"],["ㅘ","wa","ㅗ + ㅏ → 와"],["ㅙ","wae","ㅗ + ㅐ → 왜 (di kelas dibaca “we”)"],["ㅚ","oe","ㅗ + ㅣ → 외 (di kelas dibaca “we”)"],["ㅝ","wo","ㅜ + ㅓ → 워"],["ㅞ","we","ㅜ + ㅔ → 웨"],["ㅟ","wi","ㅜ + ㅣ → 위"],["ㅢ","ui","ㅡ + ㅣ → 의"]],k:[["ㄲ","kk","ㄱ kembar: g ditekan, tanpa hembusan"],["ㄸ","tt","ㄷ kembar: d/t ditekan"],["ㅃ","pp","ㅂ kembar: b/p ditekan"],["ㅆ","ss","ㅅ kembar: s ditekan"],["ㅉ","jj","ㅈ kembar: j ditekan"]],b:[["각","ㄱ","k"],["간","ㄴ","n"],["갇","ㄷ","t"],["갈","ㄹ","l"],["감","ㅁ","m"],["갑","ㅂ","p"],["갓","ㅅ","t"],["강","ㅇ","ng"],["갖","ㅈ","t"],["갗","ㅊ","t"],["갘","ㅋ","k"],["같","ㅌ","t"],["갚","ㅍ","p"],["갛","ㅎ","t"]].map(x=>[x[0],"ga"+x[2],"ㄱ + ㅏ + "+x[1]+" → batchim "+x[1]+" dibaca ["+x[2]+"]"])};

const FI={"ㄱ":1,"ㅋ":24,"ㄴ":4,"ㄷ":7,"ㅅ":19,"ㅈ":22,"ㅊ":23,"ㅌ":25,"ㅎ":27,"ㄹ":8,"ㅁ":16,"ㅂ":17,"ㅍ":26,"ㅇ":21};
const GR={k:"ㄱ ㅋ",n:"ㄴ",t:"ㄷ ㅅ ㅈ ㅊ ㅌ ㅎ",l:"ㄹ",m:"ㅁ",p:"ㅂ ㅍ",ng:"ㅇ"};
EX.r=[["ㄱ","k"],["ㅋ","k"],["ㄴ","n"],["ㄷ","t"],["ㅅ","t"],["ㅈ","t"],["ㅊ","t"],["ㅌ","t"],["ㅎ","t"],["ㄹ","l"],["ㅁ","m"],["ㅂ","p"],["ㅍ","p"],["ㅇ","ng"]].map(x=>[x[0],x[1],x[0]+" di akhir suku kata dibaca ["+x[1]+"]. Satu kelompok: "+GR[x[1]]]);
const ico=p=>'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';

IC.flame=ico('<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.4 1-3.2.3.6.7 1.2 1.5 1.7z"/>');
const TYP=new Set(["v","c","s","g","k","b","r"]),IV=[0,2,20,1440,4320,10080];
let SM=null;
const key=x=>mode+":"+x[0];
function MX(){try{return JSON.parse(localStorage.getItem("mx")||"{}")}catch(e){return{}}}
function upd(k,ok){try{const m=MX(),r=m[k]||{b:0,d:0,c:0,w:0};if(ok){r.b=Math.min(5,r.b+1);r.c++}else{r.b=Math.max(0,r.b-2);r.w++}r.d=Date.now()+IV[r.b]*60000;m[k]=r;localStorage.setItem("mx",JSON.stringify(m))}catch(e){}}
function mb(x){const r=MX()[key(x)];return r?Math.round((r.b+1)*100/6):0}
function stats(){const m=MX(),it=items(),n=Date.now();let seen=0,due=0,sum=0,mast=0;it.forEach(x=>{const r=m[key(x)];if(r){seen++;sum+=r.b;if(r.b>=4)mast++;if(r.d<=n)due++}});return{n:it.length,seen,due,mast,nw:it.length-seen,pct:Math.round(sum/(it.length*5)*100)}}
function streak(w){try{const d=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString(),r=JSON.parse(localStorage.getItem("st")||"{}");if(w&&r.d!=d){r.n=r.d==y?(r.n||0)+1:1;r.d=d;localStorage.setItem("st",JSON.stringify(r))}return(r.d==d||r.d==y)?(r.n||0):0}catch(e){return 0}}
const bgs=()=>(mode=="w"||mode=="p")?"font-size:2.6rem":"";
function smartHome(){
 const s=stats(),m=MX(),st=streak();
 $("app").innerHTML=`<div class="q" style="text-align:left"><div class="lbl" style="margin:0 0 8px">Penguasaan ${NAMES[mode]}</div><div class="bar"><i style="width:${s.pct}%"></i></div><p style="margin:6px 0 14px"><b style="font-size:1.7rem">${s.pct}%</b> <span class="note">· ${s.mast}/${s.n} hafal · ${s.nw} baru · ${s.due} perlu diulang</span></p><button class="on" id="sgo" style="width:100%;padding:14px">[[zap]] Mulai latihan pintar</button><p class="note" style="margin:12px 0 0">[[flame]] Runtutan: ${st} hari. Sistem memilih huruf yang paling perlu dilatih, mengenalkan huruf baru sedikit demi sedikit, dan mengulang yang salah.</p></div><div class="lbl">Peta penguasaan (tap untuk dengar)</div><div class="map ${(mode=="w"||mode=="p")?"wide":""}">${items().map(x=>{const r=m[key(x)];return `<button class="mp ${!r?"u":r.b>=5?"g":r.b>=3?"b":"y"}" data-s="${x[0]}">${x[0]}</button>`}).join("")}</div><p class="note">Abu-abu: belum dikenal · kuning: masih lemah · biru: hampir hafal · hijau: hafal.</p>`}
function sStart(){
 const m=MX(),it=items(),n=Date.now();
 const seen=it.filter(x=>m[key(x)]),nw=it.filter(x=>!m[key(x)]);
 const due=seen.filter(x=>m[key(x)].d<=n).sort((a,b)=>m[key(a)].b-m[key(b)].b);
 const intro=nw.slice(0,due.length<4?3:due.length<8?2:1),rest=due.slice(0,12-intro.length);
 let q=[...intro.map(x=>({x,i:1})),...sh(rest.map(x=>({x})))];
 if(q.length<8)q=q.concat(sh(seen.filter(x=>!rest.includes(x))).slice(0,8-q.length).map(x=>({x})));
 if(!q.length)q=sh(it).slice(0,8).map(x=>({x}));
 SM={q,i:0,ok:0,n:0,bad:[],fb:0};sShow();
}
function sBar(){return `<div class="bar"><i style="width:${SM.i/SM.q.length*100}%"></i></div><div class="note" style="margin-bottom:8px">Soal ${SM.i+1} dari ${SM.q.length}</div>`}
function sShow(){if(SM.i>=SM.q.length)return sEnd();const e=SM.q[SM.i];if(e.i&&!e.sh)sIntro(e);else sQ()}
function sIntro(e){const x=e.x;
 $("app").innerHTML=sBar()+`<div class="q"><div class="lbl" style="margin:0">Kenalan dulu</div>${IMG[x[0]]?`<img class="qi" src="${IMG[x[0]]}" alt="">`:""}<div class="big" style="${bgs()}">${x[0]}</div><h2 style="margin:0">${x[1]}</h2><div class="tip">[[bulb]] ${x[2]}</div><button class="hint" data-s="${x[0]}">[[sound]] Dengar</button><p><button class="on" id="si" style="padding:12px 22px">Mengerti, tes aku</button></p></div>`;
 setTimeout(()=>say(x[0]),200)}
function sType(e){const r=MX()[key(e.x)],b=r?r.b:0;if(e.i||b<=1)return"mc";if(b==2)return"rev";if(b==3)return"ls";return TYP.has(mode)?"ty":(SM.i%2?"rev":"ls")}
function sQ(){
 SM.fb=0;const e=SM.q[SM.i],x=e.x,t=sType(e);e.t=t;
 const r=MX()[key(x)],easy=e.i||!r||r.b==0,rv=t=="rev"||t=="ls";
 const wr=[],sn=new Set();
 for(const y of sh(items().filter(y=>y[1]!=x[1]&&y[0]!=x[0]))){const k=rv?y[0]:y[1];if(!sn.has(k)){sn.add(k);wr.push(y)}if(wr.length==3)break}
 const o=sh([x,...wr]),ch=o.map(y=>`<button data-sa="${y[0]}">${y[0]}</button>`).join("");
 let b="";
 if(t=="mc")b=`<div class="big" style="${bgs()}">${x[0]}</div><div class="note">Bagaimana cara membacanya?</div><button class="hint" data-s="${x[0]}">[[sound]] Dengar</button><div class="opts">${o.map(y=>`<button data-sa="${y[0]}">${y[1]}</button>`).join("")}</div>`;
 if(t=="rev")b=`<div class="big" style="font-size:3rem">${x[1]}</div><div class="note">Pilih tulisan yang benar</div><div class="opts">${ch}</div>`;
 if(t=="ls")b=`<button class="on" data-s="${x[0]}" style="padding:16px 26px;font-size:1.15rem">[[sound]] Putar suara</button><div class="note" style="margin-top:10px">Dengarkan, lalu pilih yang kamu dengar</div><div class="opts">${ch}</div>`;
 if(t=="ty")b=`<div class="big" style="${bgs()}">${x[0]}</div><div class="note">Ketik cara bacanya dengan huruf latin</div><input id="ti" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="mis. a, ya, eo"><button class="on" id="sc" style="width:100%;padding:13px">Periksa</button>`;
 $("app").innerHTML=sBar()+`<div class="q">${b}<div class="tip" id="stip">${easy&&t!="ty"?"[[bulb]] "+x[2]:`<button class="hint" id="shint">[[bulb]] Petunjuk</button>`}</div></div>`;
 if(t=="mc"||t=="ls")setTimeout(()=>say(x[0]),200);
 if(t=="ty")setTimeout(()=>{const i=$("ti");if(i)i.focus()},60);
}
function sAns(v){
 if(SM.fb)return;SM.fb=1;
 const e=SM.q[SM.i],x=e.x;let ok;
 if(e.t=="ty")ok=x[1].toLowerCase().split("/").includes(String(v).trim().toLowerCase().replace(/\s+/g,""));else ok=v==x[0];
 SM.n++;upd(key(x),ok);
 if(ok)SM.ok++;else{SM.bad.push(x);if(!e.r){e.r=1;SM.q.splice(Math.min(SM.q.length,SM.i+4),0,{x,r:1})}}
 document.querySelectorAll("[data-sa]").forEach(b=>{b.disabled=true;if(b.dataset.sa==x[0])b.classList.add("ok");else if(b.dataset.sa==v)b.classList.add("no")});
 const ti=$("ti"),sc=$("sc");if(ti)ti.disabled=true;if(sc)sc.style.display="none";
 const r=MX()[key(x)]||{b:0},last=SM.i>=SM.q.length-1;
 $("stip").innerHTML=`${ok?"[[ok]] Benar!":"[[no]] Belum tepat."} <b>${x[0]}</b> = ${x[1]}<br>[[bulb]] ${x[2]}<br><span class="note">Level ${r.b} dari 5${ok?"":" · soal ini akan diulang"}</span><br><button class="on" id="sn" style="margin-top:10px;padding:11px 26px">${last?"Lihat hasil":"Lanjut"}</button>`;
 say(x[0]);
}
function sEnd(){
 streak(1);const s=stats(),acc=SM.n?Math.round(SM.ok/SM.n*100):0,bad=[...new Set(SM.bad.map(x=>x[0]))];
 $("app").innerHTML=`<div class="q"><div class="res">${acc>=85?"[[trophy]]":acc>=60?"[[star]]":"[[target]]"}</div><h2 style="margin:0">Akurasi ${acc}%</h2><p class="note">Penguasaan ${NAMES[mode]} sekarang ${s.pct}% · ${s.mast}/${s.n} hafal · runtutan ${streak()} hari</p>${bad.length?`<div class="lbl">Perlu diulang (tap untuk dengar)</div><div class="map ${(mode=="w"||mode=="p")?"wide":""}">${bad.map(c=>`<button class="mp y" data-s="${c}">${c}</button>`).join("")}</div>`:`<p>Semua jawabanmu benar!</p>`}<p><button class="on" id="sgo" style="padding:13px 24px">Latihan lagi</button> <button id="smh" style="padding:13px 24px">Peta penguasaan</button></p></div>`;
}
document.addEventListener("keydown",e=>{if(e.key!="Enter"||e.target.tagName=="BUTTON")return;const b=$("sn")||$("si")||(e.target.id=="ti"?$("sc"):null);if(b)b.click()});
let F=null,fl=false;
const TRIK={v:`<div class="trik"><b>Rumus mudah vokal:</b><br>• Garis <b>tegak</b> ㅣ: tanda ke <b>kanan</b> = a (ㅏ), ke <b>kiri</b> = eo (ㅓ).<br>• Garis <b>datar</b> ㅡ: tanda ke <b>atas</b> = o (ㅗ), ke <b>bawah</b> = u (ㅜ).<br>• <b>Dua tanda</b> = ada bunyi “y”: ㅑ ya, ㅕ yeo, ㅛ yo, ㅠ yu.<br>• ㅡ = eu, ㅣ = i. Hafal 4 dasar dulu: ㅏ ㅓ ㅗ ㅜ, lalu tambahkan versi “y”-nya.</div>`,c:`<div class="trik"><b>Kelompok pasangan:</b> ㄱ/ㅋ (g/k) · ㄷ/ㅌ (d/t) · ㅂ/ㅍ (b/p) · ㅈ/ㅊ (j/ch). Huruf dengan garis tambahan = bunyi lebih kuat.</div>`,s:`<div class="trik">Rumus: konsonan + vokal. ㅇ di awal tidak berbunyi: 아 = a, 오 = o.</div>`};
Object.assign(TRIK,{r:`<div class="trik"><b>Aturan batchim:</b> hanya ada <b>7 bunyi</b> akhir: k (ㄱ ㅋ) · n (ㄴ) · t (ㄷ ㅅ ㅈ ㅊ ㅌ ㅎ) · l (ㄹ) · m (ㅁ) · p (ㅂ ㅍ) · ng (ㅇ). Hafalkan kelompoknya, bukan satu per satu.</div>`,p:`<div class="trik"><b>Ayo membaca!</b> Kata-kata dari halaman 5 PPT beserta gambarnya. Lihat gambar, baca katanya, lalu uji dengan tes “Gambar → Kata”.</div>`,g:`<div class="trik"><b>Vokal gabungan</b> = dua vokal digabung. Kuncinya: <b>ㅣ</b> di belakang → ㅏ+ㅣ=ㅐ, ㅓ+ㅣ=ㅔ. Awalan <b>ㅗ/ㅜ</b> → bunyi “w”: ㅘ wa, ㅝ wo, ㅟ wi.</div>`,k:`<div class="trik"><b>Konsonan ganda</b> = huruf kembar yang diucapkan lebih <b>tegang/ditekan</b>, tanpa hembusan napas: ㄲ ㄸ ㅃ ㅆ ㅉ.</div>`,b:`<div class="trik"><b>Batchim</b> = konsonan akhir. Hanya ada <b>7 bunyi</b>: k (ㄱㅋ) · n (ㄴ) · t (ㄷㅅㅈㅊㅌㅎ) · l (ㄹ) · m (ㅁ) · p (ㅂㅍ) · ng (ㅇ).</div>`,w:`<div class="trik"><b>Kosakata</b> dari buku kelasmu. Latih membaca, lalu tebak artinya. Gunakan soal “Bacaan → Huruf” untuk melatih mengenali tulisan Korea dari artinya.</div>`});function wk(k,ok){upd(mode+":"+k,ok);try{const w=JSON.parse(localStorage.getItem("wk")||"{}");w[k]=Math.max(0,(w[k]||0)+(ok?-1:2));localStorage.setItem("wk",JSON.stringify(w))}catch(e){}}
function route(){Q=[];done=false;F=null;fl=false;head();tab=="smart"?smartHome():tab=="learn"?learn():tab=="card"?card():test()}
function card(){
 if(!F)F=sh(items().slice());
 if(!F.length){$("app").innerHTML=`<div class="q"><div class="res">[[trophy]]</div><h2>Semua kartu sudah hafal!</h2><button class="on" data-f="r">Ulangi</button></div>`;return}
 const x=F[0];
 $("app").innerHTML=`<p class="note">Sisa ${F.length} kartu. Tebak bunyinya dulu, lalu tap kartu untuk melihat jawaban. Kartu “Belum hafal” akan muncul lagi.</p><div class="q fc" data-f="flip"><div class="big" style="${(mode=="w"||mode=="p")?"font-size:2.6rem":""}">${x[0]}</div>${fl?`${IMG[x[0]]?`<img class="qi" src="${IMG[x[0]]}" alt="">`:""}<h2>${x[1]}</h2><div class="tip">[[bulb]] ${x[2]}</div>`:`<div class="note">Tap untuk membalik</div><button class="hint" data-s="${x[0]}">[[sound]] Dengar</button>`}</div>${fl?`<div class="opts"><button data-f="no">[[refresh]] Belum hafal</button><button data-f="yes">[[check]] Hafal</button></div>`:""}`;
}
try{speechSynthesis.onvoiceschanged=chk}catch(e){}chk();setTimeout(chk,800);route();
